name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: node server
        uses: actions/node@v4
        with:
          node_version: "20"
      - name: install dep
        run: npm install

      - name: run app
        run: npm test
