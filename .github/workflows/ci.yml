name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT code
        uses: actions/checkout@v4

      - name: running node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: installing node
        run: npm install

      - name: testing app
        run: npm test

      - name: use this secret
        run: echo "this secret says $MY_ENV_VAR"
        env:
          MY_ENV_VAR: ${{secrets.MY_SECRET}}
