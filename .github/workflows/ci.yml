name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install node
        run: npm install

      - name: run test
        run: npm test

  test2:
    runs-on: ubuntu-latest
    steps:
      - name: making a directory
        run: mkdir yay!!!
    needs: test
