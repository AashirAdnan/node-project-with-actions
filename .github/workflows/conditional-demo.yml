name: conditional-demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  always-runs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node version
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node-version}}

      - name: runs on everything
        run: echo "I run everytime"

  only-main:
    runs-on: ubuntu-latest
    if: ${{github.ref == 'refs/heads/main'}}
    steps:
      - name: only runs on main
        run: echo "I only run on main"

  only-pr:
    runs-on: ubuntu-latest
    if: ${{github.event_name == 'pull_request'}}
    steps:
      - name: only runs on pr
        run: echo "I only run on pr"
